apiVersion: apps/v1
kind: Deployment
metadata:
  name: cropx-backend
  namespace: default
  labels:
    app: cropx
    component: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cropx
      component: backend
  template:
    metadata:
      labels:
        app: cropx
        component: backend
    spec:
      serviceAccountName: cropx-backend

      # Init container to wait for database
      initContainers:
      - name: wait-for-db
        image: busybox:1.28
        command: ['sh', '-c', 'until nc -z cropx-backend-svc 5000; do echo waiting for backend; sleep 2; done;']

      containers:
      - name: backend
        image: docker.io/cropx-backend:latest
        imagePullPolicy: Always

        ports:
        - name: http
          containerPort: 5000
          protocol: TCP

        env:
        - name: FLASK_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: cropx-backend-config
              key: database.url

        # Resource requests and limits
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        # Liveness probe - restart if unhealthy
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        # Readiness probe - remove from service if not ready
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        # Security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true

        # Volume mounts for temporary files
        volumeMounts:
        - name: tmp
          mountPath: /tmp

      # Pod security context
      securityContext:
        fsGroup: 1001

      # Volumes
      volumes:
      - name: tmp
        emptyDir: {}

      # Pod disruption budget - min pods to remain during disruptions
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - cropx
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: cropx-backend-svc
  namespace: default
  labels:
    app: cropx
    component: backend
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: cropx
    component: backend

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cropx-backend-config
  namespace: default
data:
  database.url: "sqlite:///cropx.db"
  log.level: "INFO"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cropx-backend
  namespace: default
