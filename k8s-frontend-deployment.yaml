apiVersion: apps/v1
kind: Deployment
metadata:
  name: cropx-frontend
  namespace: default
  labels:
    app: cropx
    component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cropx
      component: frontend
  template:
    metadata:
      labels:
        app: cropx
        component: frontend
    spec:
      containers:
      - name: frontend
        image: docker.io/cropx-frontend:latest
        imagePullPolicy: Always

        ports:
        - name: http
          containerPort: 80
          protocol: TCP

        env:
        - name: REACT_APP_API_URL
          valueFrom:
            configMapKeyRef:
              name: cropx-frontend-config
              key: api.url

        # Resource requests and limits
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi

        # Liveness probe
        livenessProbe:
          httpGet:
            path: /health.html
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        # Readiness probe
        readinessProbe:
          httpGet:
            path: /health.html
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        # Security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true

        # Volume mounts
        volumeMounts:
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-pid
          mountPath: /var/run

      # Pod security context
      securityContext:
        fsGroup: 101

      # Volumes
      volumes:
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-pid
        emptyDir: {}

      # Pod anti-affinity for distribution
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - cropx
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: cropx-frontend-svc
  namespace: default
  labels:
    app: cropx
    component: frontend
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: cropx
    component: frontend

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cropx-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - cropx.example.com
    secretName: cropx-tls
  rules:
  - host: cropx.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cropx-frontend-svc
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: cropx-backend-svc
            port:
              number: 5000

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cropx-frontend-config
  namespace: default
data:
  api.url: "https://cropx.example.com/api"

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cropx-frontend-pdb
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cropx
      component: frontend
